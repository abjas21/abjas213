<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ночь телескопов</title>
  <style>
    body {
      margin: 24px;
      background: #EEF2F7;
      font-family: Arial, sans-serif;
      color: #172033;
    }
    .event-card {
      max-width: 560px;
      margin: 0 auto;
      background: #FFFFFF;
      border-radius: 16px;
      overflow: hidden;
    }
    .cover {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }
    .content { padding: 20px; }
    .button {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 8px;
      background: #0B132B;
      color: #FFFFFF;
      text-decoration: none;
    }
  </style>
</head>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect x="8" y="8" width="48" height="48" rx="12" fill="#2563EB"/>
  <circle cx="32" cy="32" r="9" fill="#FFFFFF"/>
</svg>